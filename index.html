<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChainVote DApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>ChainVote DApp</h1>
      <p class="sub">One vote per Ethereum address, recorded on Sepolia.</p>
    </header>

    <section class="panel" id="wallet">
      <div>
        <div class="label">Wallet</div>
        <div id="account" class="mono">Not connected</div>
        <div id="network" class="net">Network: unknown</div>
      </div>
      <div class="actions">
        <button id="connectBtn">Connect MetaMask</button>
        <button id="switchBtn" class="secondary" hidden>Switch to Sepolia</button>
      </div>
    </section>

    <div id="error" class="msg error" hidden role="alert"></div>
    <div id="status" class="msg status" hidden aria-live="polite"></div>

    <section id="candidates" aria-label="Candidates"></section>

    <p id="voteNote" class="note" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
